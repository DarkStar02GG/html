<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎬 播放器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0b1424;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: system-ui, -apple-system, sans-serif;
            padding: 1rem;
        }
        .card {
            max-width: 880px;
            width: 100%;
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 1.5rem 1.2rem 1.8rem;
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 30px 80px rgba(0,0,0,0.7);
        }
        .video-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
        }
        .video-wrapper video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
            outline: none;
            background: #0a0a0a;
            display: block;
        }
        .btn-turbo {
            position: absolute;
            top: 14px;
            left: 14px;
            z-index: 20;
            background: rgba(0,0,0,0.65);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.12);
            color: #fff;
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
            touch-action: manipulation;
        }
        .btn-turbo:active { transform: scale(0.92); }
        .btn-turbo.active {
            background: rgba(255,215,0,0.25);
            border-color: #ffd93d;
            color: #ffd93d;
        }
        .btn-turbo .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #4a6a8f;
            transition: 0.2s;
            display: inline-block;
        }
        .btn-turbo.active .dot { background: #ffd93d; box-shadow: 0 0 12px #ffd93d; }
        .btn-turbo .sub { font-size: 0.45rem; font-weight: 400; opacity: 0.5; }

        .btn-back {
            position: absolute;
            top: 14px;
            right: 14px;
            z-index: 20;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.06);
            color: #8ba0c9;
            padding: 5px 12px;
            border-radius: 40px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.2s;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .btn-back:active { background: rgba(255,255,255,0.1); color: #fff; }

        .player-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 0.8rem;
            color: #c8d6e5;
            flex-wrap: wrap;
            gap: 6px;
        }
        .player-info .name {
            font-size: 0.9rem;
            font-weight: 500;
            max-width: 70%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .player-info .badge {
            background: rgba(255,255,255,0.06);
            padding: 0.15rem 0.8rem;
            border-radius: 40px;
            font-size: 0.65rem;
            color: #8ba0c9;
            border: 1px solid rgba(255,255,255,0.04);
        }
        .controls-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 0.6rem;
            padding: 0.3rem 0.6rem;
            background: rgba(255,255,255,0.03);
            border-radius: 60px;
            border: 1px solid rgba(255,255,255,0.05);
            flex-wrap: wrap;
            justify-content: center;
        }
        .controls-bar label {
            color: #8ba0c9;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .controls-bar select {
            background: rgba(255,255,255,0.08);
            color: #e8edf5;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 30px;
            padding: 0.15rem 0.7rem;
            font-size: 0.8rem;
            cursor: pointer;
            outline: none;
        }
        .controls-bar select option { background: #1a2639; color: #e8edf5; }
        .speed-display {
            color: #ffd93d;
            font-weight: 500;
            min-width: 36px;
            text-align: center;
            font-size: 0.85rem;
        }
        .status {
            text-align: center;
            margin-top: 0.4rem;
            font-size: 0.75rem;
            color: #5a7a9f;
        }
        .status .ok { color: #51cf66; }
        .status .err { color: #ff6b6b; }

        @media (max-width: 480px) {
            .btn-turbo { top: 10px; left: 10px; padding: 4px 10px; font-size: 0.85rem; }
            .btn-back { top: 10px; right: 10px; padding: 4px 10px; font-size: 0.7rem; }
            .controls-bar { gap: 6px; padding: 0.2rem 0.4rem; }
        }
    </style>
</head>
<body>

<div class="card">
    <div class="video-wrapper">
        <video id="videoPlayer" controls playsinline preload="metadata">
            <source id="videoSource" src="" type="video/mp4">
            您的浏览器不支持视频播放。
        </video>
        <button class="btn-turbo" id="turboBtn"><span class="dot"></span> 3× <span class="sub">Turbo</span></button>
        <a href="https://icebo.netlify.app/video.html" class="btn-back"><i class="fas fa-arrow-left"></i> 列表</a>
    </div>
    <div class="player-info">
        <span class="name" id="playerName">视频</span>
        <span class="badge" id="playerBadge">MP4</span>
    </div>
    <div class="controls-bar">
        <label><i class="fas fa-gauge-high"></i> 倍速</label>
        <select id="speedSelect">
            <option value="0.25">0.25×</option><option value="0.5">0.5×</option>
            <option value="0.75">0.75×</option><option value="1.0" selected>1.0×</option>
            <option value="1.25">1.25×</option><option value="1.5">1.5×</option>
            <option value="1.75">1.75×</option><option value="2.0">2.0×</option>
            <option value="2.5">2.5×</option><option value="3.0">3.0×</option>
        </select>
        <span class="speed-display" id="speedDisplay">1.0×</span>
    </div>
    <div class="status" id="statusMsg"><i class="fas fa-check-circle ok"></i> 点击 3× 切换加速</div>
</div>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

<script>
(function() {
    var video = document.getElementById('videoPlayer');
    var source = document.getElementById('videoSource');
    var playerName = document.getElementById('playerName');
    var playerBadge = document.getElementById('playerBadge');
    var statusMsg = document.getElementById('statusMsg');
    var turboBtn = document.getElementById('turboBtn');
    var speedSelect = document.getElementById('speedSelect');
    var speedDisplay = document.getElementById('speedDisplay');

    // ============================================================
    // 从 URL 参数获取视频地址
    // ============================================================
    var urlParams = new URLSearchParams(window.location.search);
    var videoUrl = urlParams.get('url');

    if (videoUrl) {
        source.src = decodeURIComponent(videoUrl);
        video.load();
        playerName.textContent = '视频';
        playerBadge.textContent = 'MP4';
        statusMsg.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 加载中...';
    } else {
        statusMsg.innerHTML = '<i class="fas fa-exclamation-circle err"></i> 未指定视频地址';
        playerName.textContent = '无视频';
    }

    // ============================================================
    // 倍速控制
    // ============================================================
    var isTurboActive = false;

    function updateSpeedDisplay(r) {
        speedDisplay.textContent = r.toFixed(2) + '×';
        var opt = Array.from(speedSelect.options).find(function(o) {
            return Math.abs(parseFloat(o.value) - r) < 0.01;
        });
        if (opt) speedSelect.value = opt.value;
    }

    function toggleTurbo() {
        if (isTurboActive) {
            isTurboActive = false;
            turboBtn.classList.remove('active');
            video.playbackRate = 1.0;
            updateSpeedDisplay(1.0);
            speedSelect.value = '1.0';
        } else {
            isTurboActive = true;
            turboBtn.classList.add('active');
            video.playbackRate = 3.0;
            updateSpeedDisplay(3.0);
            speedSelect.value = '3.0';
        }
    }

    turboBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        toggleTurbo();
    });

    speedSelect.addEventListener('change', function() {
        var rate = parseFloat(this.value);
        video.playbackRate = rate;
        updateSpeedDisplay(rate);
        if (Math.abs(rate - 3.0) < 0.01) {
            isTurboActive = true;
            turboBtn.classList.add('active');
        } else {
            isTurboActive = false;
            turboBtn.classList.remove('active');
        }
    });

    video.addEventListener('ratechange', function() {
        var cur = video.playbackRate;
        updateSpeedDisplay(cur);
        var opt = Array.from(speedSelect.options).find(function(o) {
            return Math.abs(parseFloat(o.value) - cur) < 0.01;
        });
        if (opt) speedSelect.value = opt.value;
        if (Math.abs(cur - 3.0) < 0.01) {
            isTurboActive = true;
            turboBtn.classList.add('active');
        } else {
            isTurboActive = false;
            turboBtn.classList.remove('active');
        }
    });

    document.addEventListener('keydown', function(e) {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
        if (e.key === 'k' || e.key === 'K') {
            e.preventDefault();
            var cur = video.playbackRate;
            var nr = Math.min(3.0, cur + 0.25);
            video.playbackRate = nr;
        }
        if (e.key === 'j' || e.key === 'J') {
            e.preventDefault();
            var cur = video.playbackRate;
            var nr = Math.max(0.25, cur - 0.25);
            video.playbackRate = nr;
        }
    });

    // ============================================================
    // 错误处理
    // ============================================================
    video.addEventListener('error', function(e) {
        var err = video.error;
        var msg = '视频加载失败';
        if (err) {
            switch(err.code) {
                case 1: msg = '视频加载被中止'; break;
                case 2: msg = '直链已过期或无效'; break;
                case 3: msg = '视频解码失败'; break;
                case 4: msg = '视频地址无效'; break;
            }
        }
        statusMsg.innerHTML = '<i class="fas fa-exclamation-circle err"></i> ' + msg;
    });

    video.addEventListener('canplay', function() {
        statusMsg.innerHTML = '<i class="fas fa-check-circle ok"></i> ✅ 点击 3× 切换加速';
    });
})();
</script>
</body>
</html>
